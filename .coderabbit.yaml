language: "ko-KR"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/.xml"
  path_instructions:
    - path: "src/main/java/com/example/demo/*.java"
      instructions: "Review the java code for conformity with the spring webflux framework, highlighting any deviations."
    - path: "src/test/**/*"
      instructions: |
        "Assess the unit test code employing the Mockito testing framework. Confirm that:
        - The tests adhere to Mockito's established best practices.
        - Test descriptions are sufficiently detailed to clarify the purpose of each test."
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
chat:
  auto_reply: true